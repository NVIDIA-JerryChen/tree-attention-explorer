html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;tree-attention-mask-vis&quot;&gt;
  &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Mask 示例控制&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;tam-height&quot;&gt;
      树规模
      &lt;select class=&quot;form-select&quot; id=&quot;tam-height&quot;&gt;
        &lt;option value=&quot;2&quot;&gt;7 节点 · 高度 2&lt;/option&gt;
        &lt;option value=&quot;3&quot;&gt;15 节点 · 高度 3&lt;/option&gt;
        &lt;option value=&quot;4&quot;&gt;31 节点 · 高度 4&lt;/option&gt;
        &lt;option value=&quot;5&quot;&gt;63 节点 · 高度 5&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;tam-query&quot;&gt;
      Query block
      &lt;select class=&quot;form-select&quot; id=&quot;tam-query&quot;&gt;&lt;/select&gt;
    &lt;/label&gt;
  &lt;/div&gt;

  &lt;div class=&quot;viz-row tam-summary&quot; aria-live=&quot;polite&quot;&gt;
    &lt;span class=&quot;viz-badge&quot; id=&quot;tam-query-badge&quot;&gt;&lt;/span&gt;
    &lt;span class=&quot;viz-badge&quot; id=&quot;tam-max-badge&quot;&gt;&lt;/span&gt;
    &lt;span class=&quot;text-small&quot; id=&quot;tam-path&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tam-layout&quot;&gt;
    &lt;section aria-label=&quot;树结构&quot;&gt;
      &lt;svg id=&quot;tam-tree&quot; class=&quot;tam-tree&quot; role=&quot;img&quot;&gt;&lt;/svg&gt;
    &lt;/section&gt;
    &lt;section aria-label=&quot;Tree Attention mask&quot;&gt;
      &lt;svg id=&quot;tam-mask&quot; class=&quot;tam-mask&quot; role=&quot;img&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;tam-strip-label text-small&quot;&gt;选中 Query 行（放大）&lt;/div&gt;
      &lt;svg id=&quot;tam-row-strip&quot; class=&quot;tam-row-strip&quot; role=&quot;img&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;viz-row tam-legend text-small&quot; aria-label=&quot;图例&quot;&gt;
        &lt;span&gt;&lt;i class=&quot;tam-swatch tam-visible&quot;&gt;&lt;/i&gt;可见 KV&lt;/span&gt;
        &lt;span&gt;&lt;i class=&quot;tam-swatch tam-hole&quot;&gt;&lt;/i&gt;选中行中的孔洞&lt;/span&gt;
        &lt;span&gt;&lt;i class=&quot;tam-swatch tam-hidden&quot;&gt;&lt;/i&gt;不可见&lt;/span&gt;
      &lt;/div&gt;
    &lt;/section&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;style&gt;
  #tree-attention-mask-vis {
    color: var(--foreground);
    width: 100%;
  }

  #tree-attention-mask-vis .tam-summary {
    justify-content: flex-start;
    margin: 12px 0 14px;
  }

  #tree-attention-mask-vis .tam-layout {
    display: grid;
    grid-template-columns: minmax(210px, 0.72fr) minmax(0, 1.45fr);
    gap: 18px;
    align-items: start;
  }

  #tree-attention-mask-vis .tam-tree,
  #tree-attention-mask-vis .tam-mask,
  #tree-attention-mask-vis .tam-row-strip {
    display: block;
    width: 100%;
    height: auto;
    color: var(--foreground);
  }

  #tree-attention-mask-vis .tam-strip-label {

  }

  #tree-attention-mask-vis .tam-edge {

  #tree-attention-mask-vis .tam-edge-path {

  }

  #tree-attention-mask-vis .tam-node {

  #tree-attention-mask-vis .tam-node-path {
    fill: color-mix(in srgb, var(--viz-series-1) 28%, var(--card));

  }

  #tree-attention-mask-vis .tam-node-query {
    fill: var(--primary);
    stroke: var(--primary);
  }

  #tree-attention-mask-vis .tam-node-label {
    fill: var(--foreground);
    font-weight: 500;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  #tree-attention-mask-vis .tam-node-label-query {
    fill: var(--primary-foreground);
  }

  #tree-attention-mask-vis .tam-cell-hidden {
    fill: color-mix(in srgb, var(--muted) 18%, transparent);
    stroke: var(--border);
    stroke-width: 0.7;
  }

  #tree-attention-mask-vis .tam-cell-visible {
    fill: color-mix(in srgb, var(--viz-series-1) 26%, transparent);
    stroke: var(--border);
    stroke-width: 0.7;
  }

  #tree-attention-mask-vis .tam-cell-selected {
    fill: color-mix(in srgb, var(--viz-series-1) 72%, var(--card));
    stroke: var(--foreground);
    stroke-width: 1.2;
  }

  #tree-attention-mask-vis .tam-cell-hole {
    fill: color-mix(in srgb, var(--viz-series-2) 23%, transparent);
    stroke: var(--viz-series-2);
    stroke-width: 1.2;
  }

  #tree-attention-mask-vis .tam-axis-label,
  #tree-attention-mask-vis .tam-cell-text {
    fill: var(--foreground);
    text-anchor: middle;
    dominant-baseline: middle;
  }

  #tree-attention-mask-vis .tam-row-label {
    text-anchor: end;
  }

  #tree-attention-mask-vis .tam-axis-title {
    fill: var(--muted-foreground);
    font-weight: 500;
  }

  #tree-attention-mask-vis .tam-selected-row {
    fill: none;
    stroke: var(--primary);
    stroke-width: 2.2;
  }

  #tree-attention-mask-vis .tam-legend {
    justify-content: flex-start;
    margin-top: 8px;
  }

  #tree-attention-mask-vis .tam-legend &gt; span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  #tree-attention-mask-vis .tam-swatch {
    display: inline-block;
    width: 13px;
    height: 13px;
    border: 1px solid var(--border);
  }

  #tree-attention-mask-vis .tam-visible {
    background: color-mix(in srgb, var(--viz-series-1) 72%, var(--card));
  }

  #tree-attention-mask-vis .tam-hole {
    background: color-mix(in srgb, var(--viz-series-2) 23%, transparent);
    border-color: var(--viz-series-2);
  }

  #tree-attention-mask-vis .tam-hidden {
    background: color-mix(in srgb, var(--muted) 18%, transparent);
  }

  @media (max-width: 620px) {
    #tree-attention-mask-vis .tam-layout {
      grid-template-columns: 1fr;
    }

    #tree-attention-mask-vis .tam-tree {
      max-height: 290px;
    }
  }
&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;tree-attention-mask-vis&quot;);
  const heightSelect = root.querySelector(&quot;#tam-height&quot;);
  const querySelect = root.querySelector(&quot;#tam-query&quot;);
  const treeSvg = root.querySelector(&quot;#tam-tree&quot;);
  const maskSvg = root.querySelector(&quot;#tam-mask&quot;);
  const rowStripSvg = root.querySelector(&quot;#tam-row-strip&quot;);
  const queryBadge = root.querySelector(&quot;#tam-query-badge&quot;);
  const maxBadge = root.querySelector(&quot;#tam-max-badge&quot;);
  const pathLabel = root.querySelector(&quot;#tam-path&quot;);
  const svgNS = &quot;http://www.w3.org/2000/svg&quot;;

  const makeSvg = (tag, attrs = {}) =&gt; {
    const element = document.createElementNS(svgNS, tag);
    Object.entries(attrs).forEach(([key, value]) =&gt; element.setAttribute(key, String(value)));
    return element;
  };

  const buildTree = (height) =&gt; {
    const nodes = [];
    const total = (2 ** (height + 1)) - 1;
    for (let index = 0; index &lt; total; index += 1) {
      const depth = Math.floor(Math.log2(index + 1));
      const offset = index - ((2 ** depth) - 1);
      const label = depth === 0
        ? &quot;R&quot;
        : `${String.fromCharCode(64 + depth)}${offset + 1}`;
      nodes.push({
        id: index,
        label,
        depth,
        offset,
        parent: index === 0 ? null : Math.floor((index - 1) / 2),
        children: []
      });
    }
    nodes.forEach((node) =&gt; {
      if (node.parent !== null) nodes[node.parent].children.push(node.id);
    });

    const preorder = [];
    const visit = (id) =&gt; {
      preorder.push(id);
      nodes[id].children.forEach(visit);
    };
    visit(0);
    return { nodes, preorder };
  };

  const ancestorPath = (nodes, id) =&gt; {
    const path = [];
    let current = id;
    while (current !== null) {
      path.push(current);
      current = nodes[current].parent;
    }
    return path.reverse();
  };

  const intervalRuns = (visibleColumns) =&gt; {
    const runs = [];
    visibleColumns.forEach((column) =&gt; {
      const last = runs[runs.length - 1];
      if (!last || column !== last[last.length - 1] + 1) runs.push([column]);
      else last.push(column);
    });
    return runs;
  };

  const calculate = (tree, queryId) =&gt; {
    const position = new Map(tree.preorder.map((id, index) =&gt; [id, index]));
    const path = ancestorPath(tree.nodes, queryId);
    const visibleColumns = path.map((id) =&gt; position.get(id)).sort((a, b) =&gt; a - b);
    const runs = intervalRuns(visibleColumns);
    const allCounts = tree.nodes.map((node) =&gt; {
      const columns = ancestorPath(tree.nodes, node.id)
        .map((id) =&gt; position.get(id))
        .sort((a, b) =&gt; a - b);
      return intervalRuns(columns).length;
    });
    return { position, path, visibleColumns, runs, maxIntervals: Math.max(...allCounts) };
  };

  const renderTree = (tree, queryId, state) =&gt; {
    treeSvg.replaceChildren();
    const maxDepth = Math.max(...tree.nodes.map((node) =&gt; node.depth));
    const dense = maxDepth &gt;= 4;
    const width = dense ? 620 : 430;
    const levelGap = dense ? 58 : 76;
    const height = 58 + (maxDepth * levelGap);
    treeSvg.setAttribute(&quot;viewBox&quot;, `0 0 ${width} ${height}`);
    treeSvg.setAttribute(&quot;aria-labelledby&quot;, &quot;tam-tree-title tam-tree-desc&quot;);

    const title = makeSvg(&quot;title&quot;, { id: &quot;tam-tree-title&quot; });
    title.textContent = &quot;树结构与选中 Query 的祖先路径&quot;;
    const desc = makeSvg(&quot;desc&quot;, { id: &quot;tam-tree-desc&quot; });
    desc.textContent = `选中 ${tree.nodes[queryId].label}，路径为 ${state.path.map((id) =&gt; tree.nodes[id].label).join(&quot; 到 &quot;)}`;
    treeSvg.append(title, desc);

    const coords = new Map();
    tree.nodes.forEach((node) =&gt; {
      const levelCount = 2 ** node.depth;
      coords.set(node.id, {
        x: ((node.offset + 0.5) * width) / levelCount,
        y: 24 + (node.depth * levelGap)
      });
    });
    const pathSet = new Set(state.path);

    tree.nodes.forEach((node) =&gt; {
      if (node.parent === null) return;
      const from = coords.get(node.parent);
      const to = coords.get(node.id);
      const onPath = pathSet.has(node.parent) &amp;&amp; pathSet.has(node.id);
      treeSvg.appendChild(makeSvg(&quot;line&quot;, {
        x1: from.x,
        y1: from.y + (dense ? 5 : 15),
        x2: to.x,
        y2: to.y - (dense ? 5 : 15),
        class: onPath ? &quot;tam-edge tam-edge-path&quot; : &quot;tam-edge&quot;
      }));
    });

    tree.nodes.forEach((node) =&gt; {
      const point = coords.get(node.id);
      const onPath = pathSet.has(node.id);
      const isQuery = node.id === queryId;
      const group = makeSvg(&quot;g&quot;);
      const nodeClass = isQuery
        ? &quot;tam-node tam-node-query&quot;
        : onPath
          ? &quot;tam-node tam-node-path&quot;
          : &quot;tam-node&quot;;
      if (dense) {
        group.appendChild(makeSvg(&quot;circle&quot;, {
          cx: point.x,
          cy: point.y,
          r: isQuery ? 7 : onPath ? 6 : 3.5,
          class: nodeClass
        }));
        if (onPath) {
          const text = makeSvg(&quot;text&quot;, {
            x: point.x - 10,
            y: point.y,
            class: &quot;tam-node-label tam-row-label&quot;
          });
          text.textContent = node.label;
          group.appendChild(text);
        }
      } else {
        group.appendChild(makeSvg(&quot;rect&quot;, {
          x: point.x - 24,
          y: point.y - 15,
          width: 48,
          height: 30,
          rx: 7,
          class: nodeClass
        }));
        const text = makeSvg(&quot;text&quot;, {
          x: point.x,
          y: point.y,
          class: isQuery ? &quot;tam-node-label tam-node-label-query&quot; : &quot;tam-node-label&quot;
        });
        text.textContent = node.label;
        group.appendChild(text);
      }
      treeSvg.appendChild(group);
    });
  };

  const renderMask = (tree, queryId, state) =&gt; {
    maskSvg.replaceChildren();
    const count = tree.preorder.length;
    const cell = count &lt;= 7 ? 38 : count &lt;= 15 ? 26 : count &lt;= 31 ? 15 : 8;
    const left = count &lt;= 7 ? 54 : count &lt;= 15 ? 48 : 38;
    const top = count &lt;= 7 ? 58 : count &lt;= 15 ? 52 : 34;
    const width = left + (cell * count) + 8;
    const height = top + (cell * count) + 8;
    maskSvg.setAttribute(&quot;viewBox&quot;, `0 0 ${width} ${height}`);
    maskSvg.setAttribute(&quot;aria-labelledby&quot;, &quot;tam-mask-title tam-mask-desc&quot;);

    const title = makeSvg(&quot;title&quot;, { id: &quot;tam-mask-title&quot; });
    title.textContent = &quot;Tree Attention 可见性矩阵&quot;;
    const desc = makeSvg(&quot;desc&quot;, { id: &quot;tam-mask-desc&quot; });
    desc.textContent = `行是 Query，列是 KV。选中 ${tree.nodes[queryId].label}，其可见 KV 被分成 ${state.runs.length} 个区间。`;
    maskSvg.append(title, desc);

    const qTitle = makeSvg(&quot;text&quot;, { x: 4, y: top - 12, class: &quot;tam-axis-title&quot; });
    qTitle.textContent = &quot;Q ↓&quot;;
    const kvTitle = makeSvg(&quot;text&quot;, { x: left, y: 12, class: &quot;tam-axis-title&quot; });
    kvTitle.textContent = &quot;KV →&quot;;
    maskSvg.append(qTitle, kvTitle);

    if (count &lt;= 15) {
      tree.preorder.forEach((id, index) =&gt; {
        const node = tree.nodes[id];
        const x = left + (index * cell) + (cell / 2);
        const y = top + (index * cell) + (cell / 2);

        const colLabel = makeSvg(&quot;text&quot;, {
          x,
          y: top - 10,
          class: &quot;tam-axis-label&quot;,
          transform: `rotate(-45 ${x} ${top - 10})`
        });
        colLabel.textContent = node.label;
        const rowLabel = makeSvg(&quot;text&quot;, {
          x: left - 10,
          y,
          class: &quot;tam-axis-label tam-row-label&quot;
        });
        rowLabel.textContent = node.label;
        maskSvg.append(colLabel, rowLabel);
      });
    }

    const selectedRow = state.position.get(queryId);
    if (count &gt; 15) {
      const selectedLabel = makeSvg(&quot;text&quot;, {
        x: left - 7,
        y: top + (selectedRow * cell) + (cell / 2),
        class: &quot;tam-axis-label tam-row-label&quot;
      });
      selectedLabel.textContent = tree.nodes[queryId].label;
      maskSvg.appendChild(selectedLabel);
    }
    const selectedPathPositions = new Set(state.visibleColumns);
    const firstVisible = state.visibleColumns[0];
    const lastVisible = state.visibleColumns[state.visibleColumns.length - 1];
    const intervalByColumn = new Map();
    state.runs.forEach((run, intervalIndex) =&gt; {
      run.forEach((column) =&gt; intervalByColumn.set(column, intervalIndex + 1));
    });

    tree.preorder.forEach((queryNodeId, row) =&gt; {
      const visible = new Set(
        ancestorPath(tree.nodes, queryNodeId).map((ancestorId) =&gt; state.position.get(ancestorId))
      );
      tree.preorder.forEach((_, column) =&gt; {
        const isVisible = visible.has(column);
        const isSelectedRow = row === selectedRow;
        const isHole = isSelectedRow
          &amp;&amp; column &gt;= firstVisible
          &amp;&amp; column &lt;= lastVisible
          &amp;&amp; !selectedPathPositions.has(column);
        const className = isHole
          ? &quot;tam-cell-hole&quot;
          : isSelectedRow &amp;&amp; isVisible
            ? &quot;tam-cell-selected&quot;
            : isVisible
              ? &quot;tam-cell-visible&quot;
              : &quot;tam-cell-hidden&quot;;

        maskSvg.appendChild(makeSvg(&quot;rect&quot;, {
          x: left + (column * cell),
          y: top + (row * cell),
          width: cell,
          height: cell,
          class: className
        }));

        if (count &lt;= 15 &amp;&amp; isSelectedRow &amp;&amp; (isVisible || isHole)) {
          const text = makeSvg(&quot;text&quot;, {
            x: left + (column * cell) + (cell / 2),
            y: top + (row * cell) + (cell / 2),
            class: &quot;tam-cell-text&quot;
          });
          text.textContent = isHole ? &quot;×&quot; : String(intervalByColumn.get(column));
          maskSvg.appendChild(text);
        }
      });
    });

    maskSvg.appendChild(makeSvg(&quot;rect&quot;, {
      x: left,
      y: top + (selectedRow * cell),
      width: cell * count,
      height: cell,
      class: &quot;tam-selected-row&quot;
    }));
  };

  const renderRowStrip = (tree, queryId, state) =&gt; {
    rowStripSvg.replaceChildren();
    const count = tree.preorder.length;
    const left = 34;
    const right = 8;
    const width = 620;
    const plotWidth = width - left - right;
    const cell = plotWidth / count;
    const top = 34;
    const cellHeight = 24;
    const height = 70;
    rowStripSvg.setAttribute(&quot;viewBox&quot;, `0 0 ${width} ${height}`);
    rowStripSvg.setAttribute(&quot;aria-labelledby&quot;, &quot;tam-strip-title tam-strip-desc&quot;);

    const title = makeSvg(&quot;title&quot;, { id: &quot;tam-strip-title&quot; });
    title.textContent = `${tree.nodes[queryId].label} 的 KV interval 分解`;
    const desc = makeSvg(&quot;desc&quot;, { id: &quot;tam-strip-desc&quot; });
    desc.textContent = `选中 Query 的祖先 KV 在 DFS 排列中形成 ${state.runs.length} 个连续区间。`;
    rowStripSvg.append(title, desc);

    const label = makeSvg(&quot;text&quot;, {
      x: left - 7,
      y: top + (cellHeight / 2),
      class: &quot;tam-axis-label tam-row-label&quot;
    });
    label.textContent = tree.nodes[queryId].label;
    rowStripSvg.appendChild(label);

    const visible = new Set(state.visibleColumns);
    const firstVisible = state.visibleColumns[0];
    const lastVisible = state.visibleColumns[state.visibleColumns.length - 1];
    for (let column = 0; column &lt; count; column += 1) {
      const isVisible = visible.has(column);
      const isHole = column &gt;= firstVisible &amp;&amp; column &lt;= lastVisible &amp;&amp; !isVisible;
      rowStripSvg.appendChild(makeSvg(&quot;rect&quot;, {
        x: left + (column * cell),
        y: top,
        width: cell,
        height: cellHeight,
        class: isVisible
          ? &quot;tam-cell-selected&quot;
          : isHole
            ? &quot;tam-cell-hole&quot;
            : &quot;tam-cell-hidden&quot;
      }));
    }

    state.runs.forEach((run, index) =&gt; {
      const centerColumn = (run[0] + run[run.length - 1] + 1) / 2;
      const text = makeSvg(&quot;text&quot;, {
        x: left + (centerColumn * cell),
        y: index % 2 === 0 ? 10 : 23,
        class: &quot;tam-cell-text&quot;
      });
      text.textContent = String(index + 1);
      rowStripSvg.appendChild(text);
    });
  };

  const render = (resetQuery = false) =&gt; {
    const height = Number(heightSelect.value);
    const tree = buildTree(height);
    const previousLabel = querySelect.value;
    querySelect.replaceChildren();
    tree.preorder.forEach((id) =&gt; {
      const option = document.createElement(&quot;option&quot;);
      option.value = tree.nodes[id].label;
      option.textContent = tree.nodes[id].label;
      querySelect.appendChild(option);
    });
    const defaultLabel = `${String.fromCharCode(64 + height)}${2 ** height}`;
    querySelect.value = !resetQuery &amp;&amp; tree.preorder.some((id) =&gt; tree.nodes[id].label === previousLabel)
      ? previousLabel
      : defaultLabel;

    const queryId = tree.nodes.find((node) =&gt; node.label === querySelect.value).id;
    const state = calculate(tree, queryId);
    queryBadge.textContent = `Query ${tree.nodes[queryId].label}: ${state.runs.length} intervals`;
    maxBadge.textContent = `全树最大: ${state.maxIntervals}`;
    const pathNames = state.path.map((id) =&gt; tree.nodes[id].label);
    const intervalNames = state.runs.map((run) =&gt; (
      `[${run.map((column) =&gt; tree.nodes[tree.preorder[column]].label).join(&quot;, &quot;)}]`
    ));
    pathLabel.textContent = `${pathNames.join(&quot; → &quot;)}　${intervalNames.join(&quot; + &quot;)}`;
    renderTree(tree, queryId, state);
    renderMask(tree, queryId, state);
    renderRowStrip(tree, queryId, state);
  };

  const rerenderQuery = () =&gt; {
    const height = Number(heightSelect.value);
    const tree = buildTree(height);
    const queryId = tree.nodes.find((node) =&gt; node.label === querySelect.value).id;
    const state = calculate(tree, queryId);
    queryBadge.textContent = `Query ${tree.nodes[queryId].label}: ${state.runs.length} intervals`;
    maxBadge.textContent = `全树最大: ${state.maxIntervals}`;
    const pathNames = state.path.map((id) =&gt; tree.nodes[id].label);
    const intervalNames = state.runs.map((run) =&gt; (
      `[${run.map((column) =&gt; tree.nodes[tree.preorder[column]].label).join(&quot;, &quot;)}]`
    ));
    pathLabel.textContent = `${pathNames.join(&quot; → &quot;)}　${intervalNames.join(&quot; + &quot;)}`;
    renderTree(tree, queryId, state);
    renderMask(tree, queryId, state);
    renderRowStrip(tree, queryId, state);
  };

  heightSelect.addEventListener(&quot;change&quot;, () =&gt; render(true));
  querySelect.addEventListener(&quot;change&quot;, rerenderQuery);
  render(true);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
